<div id="counter-container" class="centered"></div>

<script>
async function fetchAndDisplayCount() {
  try {
    const response = await fetch("https://countapi.mileshilliard.com/api/v1/hit/bkd.lol");
    const data = await response.json();
    
    // Padded to 6 digits with leading zeros
    const count = data.value.toString().padStart(7, '0'); 

    const container = document.getElementById('counter-container');
    container.innerHTML = ''; 

    for (let char of count) {
      const img = document.createElement('img');
      img.src = `images/${char}.gif`;
      img.alt = char;
      img.style.height = '150px';
      container.appendChild(img);
    }
  } catch (error) {
    console.error("Counter failed to load:", error);
  }
}

fetchAndDisplayCount();
</script>
